<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Running</title>
<link rel="stylesheet" href="../../system/tokens/tokens.css">
<link rel="stylesheet" href="../../system/components/app-shell/app-shell.css">
<link rel="stylesheet" href="../../system/components/button/button.css">
<link rel="stylesheet" href="../../system/components/metric/metric.css">
<style>
.hero { padding: var(--space-5) 0 var(--space-5); }
.ring .metric { align-items: center; text-align: center; }
.split-now { display: flex; justify-content: space-between; align-items: center; padding: var(--space-3) var(--space-4); margin-bottom: var(--space-4); border-radius: var(--radius-md); background: rgba(255,255,255,.06); font-size: var(--text-sm); }
.split-now b { font: 700 var(--text-lg) / 1 var(--font-num); color: var(--color-zone-steady); }
.row { padding: var(--space-4) 0; border-top: 1px solid rgba(255,255,255,.1); text-align: center; }
.row .metric { align-items: center; }
.controls { display: flex; justify-content: center; align-items: center; gap: var(--space-6); padding: var(--space-5) 0 var(--space-6); }
.hold { font-size: var(--text-xs); text-align: center; opacity: .55; margin: 0; }
</style></head>
<body><div class="shell shell--run">
  <div class="statusbar"><span>19:01</span><span>GPS ●</span></div>
  <main class="body">
    <div class="hero">
      <div class="ring">
        <svg viewBox="0 0 260 260" aria-hidden="true">
          <circle class="ring__track" cx="130" cy="130" r="120"/>
          <circle class="ring__fill" cx="130" cy="130" r="120" stroke-dasharray="516 754"/>
        </svg>
        <div class="metric metric--lg"><span class="metric__value">3.42</span><span class="metric__goal">/ 5 km</span></div>
      </div>
    </div>
    <div class="split-now"><span>Km 4 · current split</span><b>5'36"</b></div>
    <div class="row metric-row">
      <div class="metric"><span class="metric__value">19:28</span><span class="metric__label">Time</span></div>
      <div class="metric"><span class="metric__value">5'41"</span><span class="metric__label">Avg pace</span></div>
      <div class="metric"><span class="metric__value">231</span><span class="metric__label">kcal</span></div>
    </div>
    <div class="controls">
      <button class="btn btn--secondary btn--on-dark btn--round" aria-label="Hold to end">End</button>
      <button class="btn btn--primary btn--round">Pause</button>
    </div>
    <p class="hold">Hold End for 1.5 s to end the run</p>
  </main>
</div></body></html>
