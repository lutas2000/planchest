name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.18.0 and 23.6.0 are the oldest releases that strip types by default.
        node: ["22.18.0", "23.6.0", "24", "lts/*"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run check
      # For the report page's browser test.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # The diff report page is committed (the plugin runs without a build);
      # npm test rebuilt it, so any difference means it was not rebuilt.
      # `git status` also lists files the build added that were never committed.
      - name: Check the committed report page is current
        run: |
          git status --porcelain --untracked-files=all -- report-dist
          test -z "$(git status --porcelain --untracked-files=all -- report-dist)"
      - name: Run from the checkout
        run: |
          node bin/planchest.js diff examples/stride/a examples/stride/b --out "$RUNNER_TEMP/report-src"
          node bin/planchest.js view examples/stride/a --build --out "$RUNNER_TEMP/viewer-src"
      - name: Run the packed package from node_modules
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/install" && cd "$RUNNER_TEMP/install"
          npm init -y
          npm install "$RUNNER_TEMP"/planchest-*.tgz
          npx planchest --version
          npx planchest diff "$GITHUB_WORKSPACE/examples/stride/a" "$GITHUB_WORKSPACE/examples/stride/b" --out "$RUNNER_TEMP/report-dist"
          npx planchest init "$RUNNER_TEMP/design-repo"
          test -f "$RUNNER_TEMP/design-repo/.gitignore"
          npx planchest docs design-repo > /dev/null
          npx planchest view "$GITHUB_WORKSPACE/examples/stride/a" --build --out "$RUNNER_TEMP/viewer-dist"
          test -f "$RUNNER_TEMP/viewer-dist/catalog.json"
