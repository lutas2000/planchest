# Visual diff preview for every pull request.
# When a PR is opened, reopened or gets new commits, render `planchest diff` between the
# PR's merge base and its head, deploy the report to the `pr-<number>` branch of a
# Cloudflare Pages Direct Upload project, and keep one comment on the PR with the link.
# When the PR is closed or merged, delete every preview deployment of that PR.
# Only `pull_request` triggers it: pushing a branch without a PR does nothing.
# Set-up: the planchest-publish skill.
name: PR diff preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: pr-diff-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PAGES_PROJECT: my-design-pr          # the Direct Upload project for previews
  PLANCHEST_REPO: lutas2000/planchest
  PLANCHEST_REF: v0.2.0                # the Planchest release this repo follows
  PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  COMMENT_MARKER: "<!-- planchest-diff -->"

jobs:
  preview:
    # Secrets are not available to PRs from forks.
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      HAS_CLAUDE: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # .planchest/ is git-ignored, so the tool never ends up in the report or a commit.
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PLANCHEST_REPO }}
          ref: ${{ env.PLANCHEST_REF }}
          path: .planchest/tool

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The diff compares the states of pages with a state machine in Chromium,
      # through Playwright. Playwright is a dev dependency, so it is installed
      # on its own, at the version Planchest pins, next to the production ones;
      # the rest of the dev dependencies are only for building Planchest.
      - name: Install Planchest
        run: |
          npm ci --omit=dev --no-audit --no-fund --prefix .planchest/tool
          pw=$(node -p 'require("./.planchest/tool/package.json").devDependencies.playwright')
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/playwright" "playwright@$pw"
          cp -R "$RUNNER_TEMP/playwright/node_modules/." .planchest/tool/node_modules/
          (cd .planchest/tool && npx playwright install --with-deps chromium)

      - name: Render the diff report
        id: diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # Like GitHub's "Files changed": side A is where the PR branched off.
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          node .planchest/tool/bin/planchest.js diff "$base" HEAD --out .planchest/diff

      # Steps 2-4 of the planchest-diff skill (summary.html) need Claude.
      # Skipped when neither ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN is set; the report is published either way.
      - name: Write the summary
        if: env.HAS_CLAUDE == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ steps.diff.outputs.base }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          npm install -g @anthropic-ai/claude-code
          cat > "$RUNNER_TEMP/prompt.md" <<EOF
          You are writing the visual diff summary for PR #$PR_NUMBER ("$PR_TITLE") in CI.

          1. Read .planchest/tool/skills/planchest-diff/SKILL.md and follow its steps 2 to 4. The report is already in .planchest/diff/; do not run planchest diff again.
          2. There is no browser here: read the HTML in .planchest/diff/a/ and .planchest/diff/b/ directly, with git diff $BASE HEAD for specs and tokens.
          3. Write only .planchest/diff/summary.html and change nothing else. Write in the language AGENTS.md names under "Working language". The review skill has not run here, so the Checks section says it was not run.
          EOF
          claude -p --model sonnet --max-budget-usd 1 \
            --allowedTools "Read,Glob,Grep,Write,Bash(git diff:*),Bash(git log:*)" \
            < "$RUNNER_TEMP/prompt.md"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4 pages deploy .planchest/diff
          --project-name "$PAGES_PROJECT"
          --branch "$PREVIEW_BRANCH"
          --commit-hash "$HEAD_SHA"
          --commit-message "PR #$PR_NUMBER"
          --commit-dirty=true

      - name: Comment the preview link on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.diff.outputs.base }}
        run: |
          url="https://$PREVIEW_BRANCH.$PAGES_PROJECT.pages.dev/"
          report=.planchest/diff/report.json
          body="$RUNNER_TEMP/comment.md"
          {
            echo "$COMMENT_MARKER"
            echo "### Visual diff preview"
            echo
            echo "$url"
            echo
            jq -r --arg a "${BASE:0:7}" --arg b "${HEAD_SHA:0:7}" '.comparison.counts
              | "Pages: \(.changed) changed, \(.added) added, \(.removed) removed, \(.unchanged) unchanged. Comparing `\($a)` → `\($b)`."' "$report"
            echo
            if [ -s .planchest/diff/summary.html ]; then
              # The summary links to #<file>, which lives on the report page.
              sed "s|href=\"#|href=\"$url#|g" .planchest/diff/summary.html
            else
              echo "No summary: no Claude key is set, or writing it failed."
            fi
          } > "$body"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$COMMENT_MARKER\"))) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$body" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@"$body" > /dev/null
          fi

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Delete this PR's preview deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT/deployments"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          # Collect every id first; deleting while paging would skip some.
          ids=()
          page=1
          while :; do
            resp=$(curl -fsS -H "$auth" "$api?env=preview&page=$page")
            ids+=($(jq -r --arg b "$PREVIEW_BRANCH" '.result[] | select(.deployment_trigger.metadata.branch == $b) | .id' <<< "$resp"))
            total=$(jq -r '.result_info.total_pages // 1' <<< "$resp")
            [ "$page" -ge "$total" ] && break
            page=$((page + 1))
          done
          for id in "${ids[@]}"; do
            # force=true also deletes the deployment the branch alias points at.
            curl -fsS -X DELETE -H "$auth" "$api/$id?force=true" > /dev/null
          done
          echo "Deleted ${#ids[@]} deployments of $PREVIEW_BRANCH"

      - name: Update the PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$COMMENT_MARKER\"))) | .id" | head -n1)
          [ -n "$id" ] || exit 0
          printf '%s\n### Visual diff preview\n\nThe PR is closed; its preview has been deleted.\n' "$COMMENT_MARKER" > "$RUNNER_TEMP/comment.md"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
